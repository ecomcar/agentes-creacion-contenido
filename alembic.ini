[alembic]
script_location = alembic
prepend_sys_path = .
# La URL real se lee de .env en env.py; esto es sólo un valor de respaldo.
sqlalchemy.url = postgresql+psycopg://ugc:ugc@localhost:5432/ugc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
